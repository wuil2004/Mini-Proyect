version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: minitwitter-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: minitwitter-backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/minitwitter
      - JWT_SECRET=MiSuperSecretoMiniTwitter2026
    depends_on:
      - mongodb

  # --- NUEVO SERVICIO FRONTEND ---
  frontend:
    build: ./frontend
    container_name: minitwitter-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mongo_data: